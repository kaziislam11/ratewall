# Redis: the rate limiter's only external dependency. Enforcement is
# fail-open (ADR-0001/0005), so this Deployment is intentionally plain —
# no PV, no sentinel. Losing it degrades enforcement, not availability.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ratewall
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket:
              port: 6379
          livenessProbe:
            tcpSocket:
              port: 6379
---
apiVersion: v1
kind: Service
metadata:
  # The gateway config dials `redis://redis:6379` — keep the name in sync.
  name: redis
  namespace: ratewall
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: redis

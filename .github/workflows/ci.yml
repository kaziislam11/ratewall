name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  # The README's claims, proven against the real compose stack on every
  # push: routing, fail-closed auth, and — via the chaos script — the
  # fail-open rate-limit guarantee (kill Redis mid-load, traffic keeps
  # flowing, enforcement recovers, gateway never restarts).
  compose-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: timeout 300 docker compose up -d --build --wait

      - name: Smoke test
        run: bash scripts/smoke.sh

      - name: Chaos test — kill Redis mid-load
        run: bash scripts/chaos-redis.sh

      - name: Chaos test — kill a backend mid-load
        run: bash scripts/chaos-backend.sh

      - name: Debug — gateway logs
        if: failure()
        run: docker compose logs gateway | tail -100

  # Phase 7 on real infrastructure: the kind cluster proves the k8s
  # manifests, the /readyz-wired probes, and the kill-a-pod guarantee on
  # every push. Reuses the images the compose job builds... which this job
  # builds itself (jobs don't share state): two builds is the price of a
  # meaningful, self-contained proof.
  kind-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -sSL -o kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Kill-a-pod demo (deploys the full stack)
        run: bash scripts/k8s-demo.sh

      - name: Rolling-update demo (zero dropped requests)
        run: bash scripts/k8s-rolling-update.sh

      - name: Debug — cluster state
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get events -n ratewall --sort-by=.lastTimestamp | tail -30
          kubectl logs -n ratewall -l app=gateway --tail=50 --prefix

[package]
name = "ratewall-gateway"
description = "ratewall reverse proxy / API gateway (binary)"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ratewall"
path = "src/main.rs"

[dependencies]
ratewall-core = { path = "../core" }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
